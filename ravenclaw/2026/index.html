<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202944">
  <title>Коллекция почтовых марок — День Когтеврана 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@400;500;600;700&family=Yanone+Kaffeesatz:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #202944;
      --ink-soft: #2d3857;
      --paper: #eee5d1;
      --paper-deep: #e2d6bd;
      --cream: #f6f0e2;
      --bronze: #9b8c70;
      --slate: #6d7587;
      --shadow: rgba(25, 29, 43, .18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.52), transparent 42rem),
        linear-gradient(135deg, #f3ecdd 0%, #e7dec9 52%, #eee7d9 100%);
      font-family: "Cormorant Unicase", serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(32,41,68,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(32,41,68,.018) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }

    header {
      position: relative;
      z-index: 2;
      color: var(--cream);
      background:
        radial-gradient(circle at 72% -30%, rgba(155,140,112,.22), transparent 30rem),
        linear-gradient(135deg, #1d2540, #283453 70%, #202944);
      border-bottom: 1px solid rgba(205, 188, 151, .48);
      box-shadow: 0 5px 18px rgba(20,24,38,.14);
    }

    .header-inner {
      width: min(1080px, calc(100% - 3rem));
      margin: 0 auto;
      padding: 2.25rem 0 1.85rem;
      text-align: right;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.05rem, 4vw, 3.25rem);
      font-weight: 600;
      letter-spacing: .015em;
    }

    .subtitle {
      margin: .35rem 0 0;
      color: #d8c9a9;
      font: 400 clamp(1.08rem, 2vw, 1.35rem) "Yanone Kaffeesatz", sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    nav {
      position: relative;
      z-index: 3;
      width: min(1080px, calc(100% - 3rem));
      margin: 1.05rem auto 0;
      display: flex;
      justify-content: flex-end;
      gap: .65rem;
    }

    nav a {
      color: var(--ink);
      text-decoration: none;
      font: 500 1.04rem "Yanone Kaffeesatz", sans-serif;
      letter-spacing: .04em;
      padding: .48rem .92rem .42rem;
      border: 1px solid rgba(32,41,68,.14);
      border-radius: 999px;
      background: rgba(246,240,226,.52);
      box-shadow: inset 0 1px rgba(255,255,255,.55);
    }

    nav a[aria-current="page"] {
      background: rgba(32,41,68,.09);
      border-color: rgba(32,41,68,.24);
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      width: 100%;
    }

    .gallery {
      width: min(1280px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.35rem 0 3.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .row {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: nowrap;
      gap: clamp(.7rem, 1.35vw, 1.35rem);
    }

    .stamp {
      display: block;
      width: auto;
      height: auto;
      max-height: clamp(160px, 17vw, 228px);
      max-width: 17%;
      object-fit: contain;
      cursor: zoom-in;
      user-select: none;
      transform: rotate(var(--angle)) translateY(var(--lift)) scale(var(--scale));
      transform-origin: center;
      transition:
        transform .24s ease,
        filter .24s ease;
      filter: drop-shadow(0 7px 8px var(--shadow));
      will-change: transform;
    }

    .stamp:hover {
      z-index: 4;
      transform: rotate(0deg) translateY(-7px) scale(calc(var(--scale) * 1.075));
      filter: drop-shadow(0 12px 15px rgba(25,29,43,.24));
    }

    footer {
      position: relative;
      z-index: 2;
      padding: 1.1rem 1.5rem 1.25rem;
      color: #d9cdb4;
      text-align: center;
      font: 400 .98rem "Yanone Kaffeesatz", sans-serif;
      letter-spacing: .055em;
      background: var(--ink);
      border-top: 1px solid rgba(205,188,151,.35);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      padding: 2rem;
      background: rgba(16,20,34,.82);
      backdrop-filter: blur(5px);
      cursor: zoom-out;
    }

    .modal.open {
      display: grid;
    }

    .modal-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: min(94vw, 860px);
      max-height: 94vh;
    }

    .modal img {
      display: block;
      max-width: min(88vw, 760px);
      max-height: 82vh;
      object-fit: contain;
      filter: drop-shadow(0 18px 32px rgba(0,0,0,.34));
    }

    .modal-caption {
      margin-top: .75rem;
      padding: .35rem .85rem;
      color: var(--cream);
      font: 400 1.15rem "Yanone Kaffeesatz", sans-serif;
      letter-spacing: .035em;
      text-align: center;
    }

    @media (max-width: 900px) {
      .header-inner,
      nav {
        width: min(100% - 2rem, 760px);
      }

      .gallery {
        width: min(100% - 1.25rem, 820px);
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem .75rem;
        align-items: center;
      }

      .row {
        display: contents;
      }

      .stamp {
        width: 100%;
        max-width: none;
        max-height: none;
        transform: rotate(var(--angle)) scale(.96);
      }

      .stamp:hover {
        transform: rotate(0deg) translateY(-4px) scale(1.02);
      }
    }

    @media (max-width: 620px) {
      .header-inner {
        padding: 1.65rem 0 1.35rem;
      }

      nav {
        justify-content: center;
        margin-top: .85rem;
      }

      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        padding-top: 1.4rem;
      }
    }

    @media (max-width: 430px) {
      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: .8rem .55rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  
    .content-shell {
      width: min(1080px, calc(100% - 3rem));
      margin: 0 auto;
      padding: 2.35rem 0 3.5rem;
    }

    .intro-card {
      position: relative;
      overflow: hidden;
      padding: 1.55rem 1.7rem 1.65rem;
      margin-bottom: 1.35rem;
      border: 1px solid rgba(32,41,68,.14);
      border-radius: 18px;
      background:
        radial-gradient(circle at 92% 10%, rgba(155,140,112,.12), transparent 19rem),
        rgba(246,240,226,.62);
      box-shadow:
        inset 0 1px rgba(255,255,255,.68),
        0 10px 26px rgba(25,29,43,.07);
    }

    .intro-card h2 {
      margin: 0 0 .55rem;
      font-size: clamp(1.55rem, 2.7vw, 2.15rem);
      font-weight: 600;
    }

    .intro-card p {
      margin: 0;
      max-width: 820px;
      font: 400 1.12rem/1.48 "Yanone Kaffeesatz", sans-serif;
      letter-spacing: .018em;
      color: #3f4963;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: .6rem;
      color: #897a5e;
      font: 500 .88rem "Yanone Kaffeesatz", sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .task-list {
      display: grid;
      gap: .8rem;
    }

    .task-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: .9rem 1rem;
      align-items: start;
      padding: 1.05rem 1.15rem 1.1rem;
      border: 1px solid rgba(32,41,68,.12);
      border-radius: 14px;
      background: rgba(250,247,239,.68);
      box-shadow: 0 5px 15px rgba(25,29,43,.045);
    }

    .task-number {
      display: grid;
      place-items: center;
      width: 2.35rem;
      height: 2.35rem;
      border-radius: 50%;
      color: var(--cream);
      background: var(--ink);
      font: 500 1rem "Yanone Kaffeesatz", sans-serif;
      box-shadow: inset 0 0 0 1px rgba(216,201,169,.25);
    }

    .task-card h3 {
      margin: .1rem 0 .28rem;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .task-card p {
      margin: 0;
      color: #505a72;
      font: 400 1.04rem/1.42 "Yanone Kaffeesatz", sans-serif;
    }

    .placeholder-note {
      margin-top: 1.05rem;
      padding: .85rem 1rem;
      border-left: 3px solid rgba(155,140,112,.72);
      color: #5d6476;
      background: rgba(155,140,112,.075);
      font: 400 1rem/1.42 "Yanone Kaffeesatz", sans-serif;
    }

    .badge-gallery {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .badge-slot {
      aspect-ratio: 3 / 4;
      display: grid;
      place-items: center;
      padding: .8rem;
      border: 1px dashed rgba(32,41,68,.22);
      border-radius: 14px;
      background: rgba(246,240,226,.48);
      color: #7b7f8d;
      text-align: center;
      font: 400 .92rem/1.25 "Yanone Kaffeesatz", sans-serif;
    }

    .badge-stamp {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      cursor: zoom-in;
      filter: drop-shadow(0 7px 8px var(--shadow));
      transition: transform .22s ease, filter .22s ease;
    }

    .badge-stamp:hover {
      transform: translateY(-5px) scale(1.035);
      filter: drop-shadow(0 11px 13px rgba(25,29,43,.22));
    }

    @media (max-width: 820px) {
      .content-shell {
        width: min(100% - 2rem, 760px);
      }

      .badge-gallery {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .content-shell {
        width: min(100% - 1.3rem, 560px);
        padding-top: 1.4rem;
      }

      .badge-gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .task-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 430px) {
      .badge-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <h1>Коллекция почтовых марок</h1>
      <p class="subtitle">День Когтеврана 2026</p>
    </div>
  </header>

  <main>
    <nav aria-label="Навигация">
      <a href="index.html" aria-current="page">Коллекция марок</a>
      <a href="vangogh.html">Спецзадания</a>
      <a href="employees.html">Сотрудники месяца</a>
    </nav>

    <section class="gallery" id="gallery" aria-label="Коллекция марок"></section>
  </main>

  <footer>День Когтеврана 2026 · Коллекция почтовых марок</footer>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card">
      <img id="modal-image" src="" alt="">
      <div class="modal-caption" id="modal-caption"></div>
    </div>
  </div>

  <script>
    const stamps = [
      { src: "images/stamps/01.webp", caption: "Нимерия Блэкхорн" },
      { src: "images/stamps/02.webp", caption: "Блейз Форсет" },
      { src: "images/stamps/03.webp", caption: "Литературный клуб" },
      { src: "images/stamps/04.webp", caption: "Кэмерин Ствайн" },
      { src: "images/stamps/05.webp", caption: "Morgane Dave Black" },
      { src: "images/stamps/06.webp", caption: "Эмберли Шрив-Стиверсон" },
      { src: "images/stamps/07.webp", caption: "Заря Эвергрин" },
      { src: "images/stamps/08.webp", caption: "Амилия Лиссаранд" },
      { src: "images/stamps/09.webp", caption: "Кланкер" },
      { src: "images/stamps/10.webp", caption: "Айлин Берг" },
      { src: "images/stamps/11.webp", caption: "Адрианна Сноу" },
      { src: "images/stamps/12.webp", caption: "Лиария Спраут" },
      { src: "images/stamps/13.webp", caption: "Артемисия Крум" },
      { src: "images/stamps/14.webp", caption: "Хелена Кейн" },
      { src: "images/stamps/15.webp", caption: "Мизуки Хироми" },
      { src: "images/stamps/16.webp", caption: "Люсиль Готвольф" },
      { src: "images/stamps/17.webp", caption: "Орел" },
      { src: "images/stamps/18.webp", caption: "Морен Блекфорд" },
      { src: "images/stamps/19.webp", caption: "Сборная «LaFayette»" },
      { src: "images/stamps/20.webp", caption: "Harry Sturm" },
      { src: "images/stamps/21.webp", caption: "William Roland" },
      { src: "images/stamps/22.webp", caption: "Шелия Макбрайд" },
      { src: "images/stamps/23.webp", caption: "Винсент Бернкастель" },
      { src: "images/stamps/24.webp", caption: "Мерида Морграфт" },
      { src: "images/stamps/25.webp", caption: "Блейк Эллингтон" },
      { src: "images/stamps/26.webp", caption: "Кайла Росси" },
      { src: "images/stamps/27.webp", caption: "Эсмеральда Гюго" },
      { src: "images/stamps/28.webp", caption: "Hephaestus Hunnam" },
      { src: "images/stamps/29.webp", caption: "Алисаия Рэйн" },
      { src: "images/stamps/30.webp", caption: "Беата ЛаВей" },
      { src: "images/stamps/31.webp", caption: "Амелия Нокс" },
      { src: "images/stamps/32.webp", caption: "Домовой Тедди" },
      { src: "images/stamps/33.webp", caption: "Шуга Ренн" },
      { src: "images/stamps/34.webp", caption: "Эйприл Аван" },
      { src: "images/stamps/35.webp", caption: "Женевьева Ханнэм(Пресли)" },
      { src: "images/stamps/36.webp", caption: "JuliettaHelwelldeKur" },
      { src: "images/stamps/37.webp", caption: "Merida Croved" },
      { src: "images/stamps/38.webp", caption: "Adeline Delhi-Schafer" },
      { src: "images/stamps/39.webp", caption: "Лина Скотт" },
      { src: "images/stamps/40.webp", caption: "Тайлер Фейтфулл" },
      { src: "images/stamps/41.webp", caption: "Кэтрин Шенай" },
      { src: "images/stamps/42.webp", caption: "Лукотрусы" },
      { src: "images/stamps/43.webp", caption: "Как Субхаш" },
      { src: "images/stamps/44.webp", caption: "Амброуз Сильвер-Монблейз" },
      { src: "images/stamps/45.webp", caption: "Когтевранские леденцы" },
      { src: "images/stamps/46.webp", caption: "Соланж Деллингхейм" },
      { src: "images/stamps/47.webp", caption: "Серая Леди" },
      { src: "images/stamps/48.webp", caption: "Эмма Вальд" },
      { src: "images/stamps/49.webp", caption: "ФруктоКог" },
      { src: "images/stamps/50.webp", caption: "Мария Торнаги" },
      { src: "images/stamps/51.webp", caption: "Grace Diamond-de-Kur" },
      { src: "images/stamps/52.webp", caption: "Герон Вайтмор" },
      { src: "images/stamps/53.webp", caption: "Сказка" },
      { src: "images/stamps/54.webp", caption: "Теа Старлайт" }
    ];

    const rowPattern = [6, 5, 6, 5, 6, 5, 6, 5, 6, 4];
    const gallery = document.getElementById("gallery");

    // Stable, hand-scattered feel: values depend on index and don't jump on resize.
    const angleFor = i => (((i * 17) % 9) - 4) * 0.38;
    const liftFor  = i => (((i * 11) % 5) - 2) * 1.1;
    const scaleFor = i => 0.94 + (((i * 7) % 6) * 0.012);

    let cursor = 0;
    rowPattern.forEach(rowSize => {
      const row = document.createElement("div");
      row.className = "row";

      for (let j = 0; j < rowSize && cursor < stamps.length; j++, cursor++) {
        const item = stamps[cursor];
        const img = document.createElement("img");
        img.className = "stamp";
        img.src = item.src;
        img.alt = item.caption;
        img.loading = cursor < 12 ? "eager" : "lazy";
        img.decoding = "async";
        img.dataset.caption = item.caption;
        img.style.setProperty("--angle", `${angleFor(cursor)}deg`);
        img.style.setProperty("--lift", `${liftFor(cursor)}px`);
        img.style.setProperty("--scale", scaleFor(cursor).toFixed(3));
        row.appendChild(img);
      }

      gallery.appendChild(row);
    });

    const modal = document.getElementById("modal");
    const modalImage = document.getElementById("modal-image");
    const modalCaption = document.getElementById("modal-caption");

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalImage.src = "";
      modalImage.alt = "";
      modalCaption.textContent = "";
      document.body.style.overflow = "";
    }

    gallery.addEventListener("click", event => {
      const stamp = event.target.closest(".stamp");
      if (!stamp) return;

      modalImage.src = stamp.src;
      modalImage.alt = stamp.alt;
      modalCaption.textContent = stamp.dataset.caption || "";
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    });

    modal.addEventListener("click", closeModal);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modal.classList.contains("open")) closeModal();
    });
  </script>
</body>
</html>
