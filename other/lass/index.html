<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172419">
  <title>Слизнежиж</title>
  <style>
    * { box-sizing:border-box }
    html,body { margin:0; width:100%; min-height:100%; overflow:hidden }
    body { font-family:system-ui,sans-serif; background:#172419; user-select:none; -webkit-user-select:none }
    button { -webkit-tap-highlight-color:transparent }
    .scene { position:fixed; inset:0; overflow:hidden; isolation:isolate }
    .scene::before { content:"";position:absolute;inset:-35px;background:url('background.png?v=2') center bottom/cover no-repeat;filter:blur(19px) brightness(.58);z-index:-2 }
    .scene::after { content:"";position:absolute;inset:0;background:url('background.png?v=2') center bottom/auto 100% no-repeat;z-index:-1;pointer-events:none }
    .shade { position:absolute;inset:0;background:linear-gradient(90deg,#0b180e5e,transparent 27%,transparent 73%,#0b180e5e);pointer-events:none }
    .actor { position:absolute;left:50%;bottom:9%;width:min(39vw,520px);height:min(54vh,510px);transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;z-index:3;cursor:default }
    .actor .base,.actor .glasses { display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom;pointer-events:none }
    .actor .base { filter:drop-shadow(0 14px 14px #070e0ab0);animation:breathe 3.2s ease-in-out infinite }
    .actor.bucket .base { width:80% }
    .actor .glasses { position:absolute;inset:0;transform:translate(6%,-19%);filter:drop-shadow(0 2px 3px #0009) }
    .actor .glasses[hidden] { display:none }
    .actor.armed { filter:drop-shadow(0 0 14px #f8d58c) }
    .item { appearance:none;position:absolute;z-index:5;background:none;border:0;padding:0;cursor:grab;touch-action:none;transition:filter .2s,transform .2s;filter:drop-shadow(0 7px 8px #0009) }
    .item img { display:block;width:100%;height:100%;object-fit:contain;pointer-events:none }
    .item:hover:not(:disabled),.item.armed { filter:drop-shadow(0 0 14px #ffdc90);transform:scale(1.07) }
    .item:disabled { opacity:.68;cursor:default }
    .wand { width:clamp(125px,14vw,235px);height:clamp(85px,13vh,160px);left:5%;top:52% }
    .tomato { width:clamp(115px,13vw,190px);height:clamp(100px,16vh,170px);left:10%;top:72% }
    .glasses-item { width:clamp(135px,15vw,225px);height:clamp(85px,13vh,150px);right:8%;top:53% }
    .snitch { width:clamp(145px,16vw,240px);height:clamp(80px,14vh,150px);right:5%;top:72% }
    .ghost { position:fixed;z-index:30;width:140px;height:140px;object-fit:contain;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 10px #0009) }
    .smoke { position:absolute;inset:0;z-index:10;pointer-events:none;overflow:hidden;visibility:hidden }
    .smoke.on { visibility:visible }
    .puff { position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#fff9dfec,#c6cbb4d0 40%,#c5cfb488 60%,transparent 74%);filter:blur(11px);animation:float 1.1s ease-out both;animation-delay:var(--delay) }
    .spark { position:absolute;left:var(--x);top:var(--y);color:#ffe6a0;text-shadow:0 0 12px #ffc34a;font-size:28px;animation:float 1.1s ease-out both;animation-delay:var(--delay) }
    .reset { position:absolute;right:16px;bottom:16px;z-index:8;width:40px;height:40px;border:1px solid #ffffff63;border-radius:50%;background:#14241978;color:#fff6df;cursor:pointer;font-size:25px;line-height:1;backdrop-filter:blur(4px) }
    .reset:hover { background:#253d28c9 }
    @keyframes breathe { 50% { transform:scale(1.012,.994) } }
    @keyframes float { 0% { opacity:0;transform:scale(.2) } 30% { opacity:.9 } 100% { opacity:0;transform:translate(var(--dx),-85px) scale(1.6) } }
    @media(max-width:700px) {
      .scene::after { background-size:auto 100%; }
      .actor { bottom:15%;width:75vw;height:48vh }
      .wand { width:30vw;height:13vh;left:2%;top:25% }
      .tomato { width:29vw;height:14vh;left:1%;top:61% }
      .glasses-item { width:32vw;height:11vh;right:1%;top:25% }
      .snitch { width:32vw;height:12vh;right:1%;top:62% }
    }
    @media(prefers-reduced-motion:reduce) { .actor .base,.puff,.spark { animation:none } }
  </style>
</head>
<body>
  <main class="scene" aria-label="Слизнежиж у лагерного пищеблока">
    <div class="shade" aria-hidden="true"></div>
    <button class="item wand" id="wand" aria-label="Волшебная палочка" aria-pressed="false"><img src="wand.png?v=2" alt=""></button>
    <button class="item tomato" id="tomato" disabled aria-label="Помидоры"><img src="basket.png?v=2" alt=""></button>
    <div class="actor bucket" id="actor" role="button" tabindex="0" aria-label="Ведро или слизень">
      <img class="base" id="base" src="bucket.png?v=2" alt="Ведро на 1019 литров">
      <img class="glasses" id="glasses-layer" src="glasses.png?v=2" alt="" hidden>
    </div>
    <button class="item glasses-item" id="glasses" disabled aria-label="Очки"><img src="glasses.png?v=2" alt=""></button>
    <button class="item snitch" id="snitch" disabled aria-label="Золотой снитч"><img src="snitch.png?v=2" alt=""></button>
    <div class="smoke" id="smoke" aria-hidden="true"></div>
    <button class="reset" id="reset" aria-label="Начать заново" title="Начать заново">↺</button>
  </main>
  <script>
  const actor=document.getElementById('actor'),base=document.getElementById('base'),layer=document.getElementById('glasses-layer'),smoke=document.getElementById('smoke');
  const wand=document.getElementById('wand'),tomato=document.getElementById('tomato'),glasses=document.getElementById('glasses'),snitch=document.getElementById('snitch');
  const state={born:false,glasses:false,color:'green',armed:false,busy:false};
  const versions={green:'green-slime.png?v=2',red:'red-slime.png?v=2',gold:'gold-slime.png?v=2'};
  const wait=t=>new Promise(resolve=>setTimeout(resolve,t));
  let dragging=null,ghost=null;
  function arm(value){state.armed=value;wand.classList.toggle('armed',value);actor.classList.toggle('armed',value);wand.setAttribute('aria-pressed',String(value))}
  function setEnabled(value){tomato.disabled=glasses.disabled=snitch.disabled=!value}
  function reset(){if(state.busy)return;state.born=false;state.color='green';state.glasses=false;base.src='bucket.png?v=2';base.alt='Ведро';actor.classList.add('bucket');layer.hidden=true;setEnabled(false);arm(false)}
  function mist(){smoke.replaceChildren();const r=actor.getBoundingClientRect();for(let i=0;i<19;i++){const p=document.createElement('i');p.className=i%4===0?'spark':'puff';if(i%4===0)p.textContent='✦';p.style.setProperty('--x',(r.left+r.width*(.12+Math.random()*.75))+'px');p.style.setProperty('--y',(r.top+r.height*(.12+Math.random()*.7))+'px');p.style.setProperty('--s',(65+Math.random()*135)+'px');p.style.setProperty('--delay',(Math.random()*.24)+'s');p.style.setProperty('--dx',((Math.random()-.5)*165)+'px');smoke.append(p)}}
  async function action(type){if(state.busy)return;if(type==='wand')type=state.born?'return':'birth';if(type!=='birth'&&type!=='return'&&!state.born)return;if(type==='glasses'&&state.glasses)return;state.busy=true;arm(false);mist();smoke.classList.add('on');await wait(460);
    if(type==='birth'){state.born=true;state.color='green';actor.classList.remove('bucket');base.src=versions.green;base.alt='Зеленый слизень';setEnabled(true)}
    if(type==='return'){state.born=false;state.glasses=false;state.color='green';actor.classList.add('bucket');base.src='bucket.png?v=2';base.alt='Ведро';layer.hidden=true;setEnabled(false)}
    if(type==='tomato'){state.color='red';base.src=versions.red;base.alt='Томатный слизень'}
    if(type==='snitch'){state.color='gold';base.src=versions.gold;base.alt='Золотой слизень'}
    if(type==='glasses'){state.glasses=true;layer.hidden=false}
    await wait(700);smoke.classList.remove('on');state.busy=false;
  }
  function hit(x,y){const r=actor.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
  function move(e){if(!dragging)return;ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}
  function finish(){ghost?.remove();ghost=null;dragging=null}
  for(const [element,type] of [[wand,'wand'],[tomato,'tomato'],[glasses,'glasses'],[snitch,'snitch']]){
    element.addEventListener('pointerdown',e=>{if(element.disabled||state.busy||e.button!==0)return;dragging={id:e.pointerId,x:e.clientX,y:e.clientY,type};element.setPointerCapture(e.pointerId);ghost=document.createElement('img');ghost.className='ghost';ghost.src=type==='tomato'?'tomato.png?v=2':type==='wand'?'wand.png?v=2':type==='snitch'?'snitch.png?v=2':'glasses.png?v=2';document.body.append(ghost);move(e);e.preventDefault()});
    element.addEventListener('pointermove',e=>{if(dragging?.id===e.pointerId)move(e)});
    element.addEventListener('pointerup',e=>{if(!dragging||dragging.id!==e.pointerId)return;const wasTap=Math.hypot(e.clientX-dragging.x,e.clientY-dragging.y)<12;const targetHit=hit(e.clientX,e.clientY);finish();if(targetHit)action(type);else if(wasTap){if(type==='wand')arm(!state.armed);else action(type)}});
    element.addEventListener('pointercancel',finish);
    element.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(type==='wand')arm(!state.armed);else action(type)}});
  }
  function cast(){if(state.armed)action('wand')}
  actor.addEventListener('click',cast);
  actor.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cast()}});
  document.getElementById('reset').addEventListener('click',reset);
  </script>
</body>
</html>
