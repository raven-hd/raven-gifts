<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лаборатория слизнежижа</title><meta name="description" content="Волшебное превращение ведра в слизня">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap');
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 40%,#365842,#192d23 65%,#111c17);color:#f6f3de;min-height:100svh;font-family:Nunito,sans-serif}.app{max-width:1120px;margin:auto;padding:25px;min-height:100svh;display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;color:#c9e0b3;font-size:11px;font-weight:900;letter-spacing:.12em}.tag{border:1px solid #7a917b;border-radius:40px;padding:8px 14px}h1{text-align:center;font-size:clamp(38px,6vw,68px);line-height:1;margin:34px 0 10px;letter-spacing:-.05em}h1 span{color:#c7e88f}.hint{text-align:center;color:#b5cab1;min-height:25px;margin:0}.game{display:grid;grid-template-columns:170px minmax(0,1fr) 170px;align-items:center;gap:10px;flex:1;min-height:530px}.shelf{display:flex;flex-direction:column;align-items:center;gap:25px;z-index:3}.item{touch-action:none;cursor:grab;border:1px solid #66836a;border-radius:25px;width:154px;height:155px;background:linear-gradient(135deg,#334d3b,#21382b);box-shadow:0 14px 24px #0003;color:#f7f2df;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:900 13px Nunito,sans-serif;transition:transform .2s,border-color .2s}.item:hover:not(:disabled){transform:translateY(-3px);border-color:#dcf19b}.item img{display:block;width:95%;height:111px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 6px 6px #0005)}.item:disabled{opacity:.42;cursor:default}.item.selected{border-color:#ffe6a0;box-shadow:0 0 25px #ffe09c75}.wand-shape{height:105px;font-size:90px;line-height:1;transform:rotate(-27deg);filter:drop-shadow(0 5px 6px #0008)}.placeholder{border:1px dashed #607763;border-radius:24px;width:154px;height:155px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;color:#97ad99;font-size:12px;text-align:center}.placeholder b{font-size:42px}.stage{position:relative;height:520px;min-width:0;display:flex;align-items:center;justify-content:center;isolation:isolate}.stage:before{content:'';position:absolute;z-index:-1;bottom:60px;width:80%;height:65px;background:#0009;border-radius:50%;filter:blur(27px)}.subject{position:relative;height:100%;width:min(490px,100%);display:flex;justify-content:center;align-items:center}.subject .base{width:100%;height:100%;object-fit:contain;animation:breathe 3.5s ease-in-out infinite;filter:drop-shadow(0 14px 13px #0007)}.subject.bucket .base{width:83%;height:91%;cursor:pointer}.subject.castable{filter:drop-shadow(0 0 18px #eedb9c)}.subject .glasses-overlay{position:absolute;width:52%;height:auto;left:25%;top:15%;transform:rotate(-2deg);filter:drop-shadow(0 4px 4px #0009);pointer-events:none}.subject .glasses-overlay[hidden]{display:none}.subject.boing .base{animation:boing .6s}.stage.target{outline:3px dashed #bfe59c;border-radius:45%;outline-offset:-8px}.notice{position:absolute;top:1%;left:50%;transform:translateX(-50%);z-index:7;background:#f9f0d8;color:#3e573c;padding:12px 20px;border-radius:26px;font-weight:900;min-width:190px;text-align:center;box-shadow:0 7px 24px #0006;opacity:0;transition:opacity .2s;pointer-events:none}.notice.show{opacity:1}.smoke{position:absolute;inset:0;z-index:5;visibility:hidden;pointer-events:none;overflow:hidden}.smoke.on{visibility:visible}.puff{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#edf4eaf5,#bad8c8d9 38%,#8bb6a288 60%,transparent 74%);filter:blur(12px);opacity:0;animation:float 1.2s ease-out both;animation-delay:var(--delay)}.smoke:not(.on) .puff{animation:none}.spark{position:absolute;left:var(--x);top:var(--y);color:#ffe6a0;font-size:29px;text-shadow:0 0 14px gold;animation:twinkle 1.1s ease-out both;animation-delay:var(--delay)}.smoke:not(.on) .spark{animation:none}.footer{display:flex;justify-content:center;align-items:center;gap:25px;color:#a9beaa;font-size:12px;flex-wrap:wrap}.reset{border:1px solid #7b957d;background:transparent;color:#e2efce;padding:11px 18px;border-radius:45px;font:800 13px Nunito,sans-serif;cursor:pointer}.ghost{position:fixed;z-index:20;pointer-events:none;width:115px;height:115px;object-fit:contain;transform:translate(-50%,-50%);filter:drop-shadow(0 10px 9px #0009)}@keyframes breathe{50%{transform:scale(1.018,.992)}}@keyframes boing{32%{transform:scale(1.07,.9)}70%{transform:scale(.96,1.05)}}@keyframes float{0%{opacity:0;transform:scale(.1)}28%{opacity:.9}58%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-90px) scale(1.5)}}@keyframes twinkle{0%{opacity:0;transform:scale(.2)}40%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-100px) scale(1.5)}}
@media(max-width:750px){.app{padding:17px 12px}.head{font-size:9px}h1{margin:25px 0 8px}.hint{font-size:13px}.game{display:flex;flex-direction:column;min-height:0;gap:10px}.stage{height:min(49vh,410px);width:100%}.shelf{width:100%;flex-direction:row;justify-content:center;gap:12px}.shelf.left{order:1}.shelf.right{order:2}.item,.placeholder{width:44%;max-width:170px;height:115px;border-radius:19px}.item img{height:81px}.item .wand-shape{height:75px;font-size:65px}.placeholder b{font-size:27px}.footer{margin-top:25px;gap:12px}}@media(prefers-reduced-motion:reduce){.base{animation:none!important}.puff,.spark{animation-duration:.01ms}}
</style></head><body><main class="app"><header class="head"><span>✦ ЛАБОРАТОРИЯ СТРАННЫХ СУЩЕСТВ</span><span class="tag">ЭКСПЕРИМЕНТ № 001</span></header><h1>Слизне<span>жиж</span></h1><p class="hint" id="hint">Возьми волшебную палочку и коснись ведра</p><section class="game"><div class="shelf left"><button class="item" id="wand" aria-label="Взять волшебную палочку" aria-pressed="false"><span class="wand-shape">🪄</span><span>Палочка</span></button><button class="item" id="tomato" data-effect="tomato" disabled aria-label="Перетащить помидор из корзины"><img src="basket.png" alt=""><span>Помидорка</span></button></div><div class="stage" id="stage"><div class="notice" id="notice" role="status" aria-live="polite"></div><div class="subject bucket" id="subject" role="button" tabindex="0" aria-label="Ведро на 1019 литров"><img class="base" id="base" src="bucket.png" alt="Зеленое ведро на 1019 литров"><img class="glasses-overlay" id="glasses-layer" src="glasses.png" alt="" hidden></div><div class="smoke" id="smoke" aria-hidden="true"></div></div><div class="shelf right"><button class="item" id="glasses" data-effect="glasses" disabled aria-label="Перетащить очки на слизня"><img src="glasses.png" alt=""><span>Очки крутости</span></button><div class="placeholder"><b>👑</b><strong>Корона</strong><span>Скоро появится</span></div></div></section><footer class="footer"><span>Магия требует немного терпения ✨</span><button class="reset" id="reset">↺ Начать заново</button><span>Слизень не пострадал</span></footer></main>
<script>
const subject=document.getElementById('subject'),base=document.getElementById('base'),stage=document.getElementById('stage'),smoke=document.getElementById('smoke'),hint=document.getElementById('hint'),notice=document.getElementById('notice'),wand=document.getElementById('wand'),tomato=document.getElementById('tomato'),glasses=document.getElementById('glasses'),layer=document.getElementById('glasses-layer');const state={born:false,red:false,glasses:false,wand:false,busy:false};let drag=null,ghost=null,timer;const wait=t=>new Promise(r=>setTimeout(r,t));
function say(s){notice.textContent=s;notice.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>notice.classList.remove('show'),2200)}
function fog(){smoke.replaceChildren();for(let i=0;i<18;i++){const p=document.createElement('i');p.className='puff';p.style.setProperty('--x',(17+Math.random()*64)+'%');p.style.setProperty('--y',(18+Math.random()*58)+'%');p.style.setProperty('--s',(100+Math.random()*160)+'px');p.style.setProperty('--delay',(Math.random()*.25)+'s');p.style.setProperty('--dx',((Math.random()-.5)*180)+'px');smoke.append(p)}for(let i=0;i<14;i++){const s=document.createElement('b');s.className='spark';s.textContent=i%2?'✦':'✧';s.style.setProperty('--x',(16+Math.random()*65)+'%');s.style.setProperty('--y',(20+Math.random()*62)+'%');s.style.setProperty('--delay',(Math.random()*.3)+'s');s.style.setProperty('--dx',((Math.random()-.5)*170)+'px');smoke.append(s)}}
async function transform(type){if(state.busy||type==='birth'&&state.born||type!=='birth'&&!state.born||type==='tomato'&&state.red||type==='glasses'&&state.glasses)return;state.busy=true;fog();smoke.classList.add('on');await wait(470);if(type==='birth'){state.born=true;state.wand=false;wand.classList.remove('selected');wand.setAttribute('aria-pressed','false');subject.className='subject';base.src='green-slime.png';base.alt='Зеленый желейный слизень';tomato.disabled=glasses.disabled=false;hint.textContent='Перетащи помидор или очки на слизня';say('Бульк! Он ожил! 💚')}if(type==='tomato'){state.red=true;base.src='red-slime.png';base.alt='Красный томатный слизень';hint.textContent='Слизень готов к новым экспериментам';say('Томатная эволюция! 🍅')}if(type==='glasses'){state.glasses=true;layer.hidden=false;say('Теперь он крут! 😎')}await wait(800);smoke.classList.remove('on');subject.classList.add('boing');state.busy=false}
wand.addEventListener('click',()=>{if(state.born)return say('Волшебство уже случилось!');state.wand=!state.wand;wand.classList.toggle('selected',state.wand);wand.setAttribute('aria-pressed',String(state.wand));subject.classList.toggle('castable',state.wand);hint.textContent=state.wand?'Теперь нажми на ведро':'Возьми волшебную палочку и коснись ведра'});function cast(){if(!state.born){if(state.wand)transform('birth');else say('Сначала возьми палочку!')}}subject.addEventListener('click',cast);subject.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cast()}});
function move(e){if(!ghost)return;ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';const r=subject.getBoundingClientRect();stage.classList.toggle('target',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)}function end(){ghost?.remove();ghost=null;drag=null;stage.classList.remove('target')}for(const el of [tomato,glasses]){el.addEventListener('pointerdown',e=>{if(el.disabled||state.busy||e.button!==0)return;drag={id:e.pointerId,type:el.dataset.effect,x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId);ghost=document.createElement('img');ghost.className='ghost';ghost.src=drag.type==='tomato'?'tomato.png':'glasses.png';document.body.append(ghost);move(e);e.preventDefault()});el.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id)move(e)});el.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const r=subject.getBoundingClientRect();const hit=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;const clicked=Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<10;const type=drag.type;end();if(hit||clicked)transform(type)});el.addEventListener('pointercancel',end);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();transform(el.dataset.effect)}})}
document.getElementById('reset').addEventListener('click',()=>{if(state.busy)return;Object.assign(state,{born:false,red:false,glasses:false,wand:false,busy:false});base.src='bucket.png';base.alt='Зеленое ведро на 1019 литров';subject.className='subject bucket';layer.hidden=true;tomato.disabled=glasses.disabled=true;wand.classList.remove('selected');wand.setAttribute('aria-pressed','false');hint.textContent='Возьми волшебную палочку и коснись ведра';say('Начнем сначала!')});
</script></body></html>
