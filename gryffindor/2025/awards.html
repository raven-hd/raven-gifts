    header h1 {

    header p {
      text-align: right;

	  display: flex;
	  justify-content: center;
	  gap: 1rem;
	  margin: 1.5rem 0 1rem; 
	  width: 100%; 
	}
    
    main {
      margin-top: 0.5rem;
      padding-top: 1rem;
      z-index: 1;
      flex: 1;
    }

    .section-title {
      text-align: center;
      font-family: "Oswald", sans-serif;
      font-size: 2rem;
      color: #5c4942;
      margin: 1.5rem 0 0.5rem;
      padding-bottom: 0.5rem;
      display: inline-block;
      position: relative;
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: calc(6 * (160px + 1rem) - 1rem); /* Ширина шести марок с учетом gap */
      height: 2px;
      background-color: #5c4942;
    }

    .section-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1rem;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem;
      overflow: hidden;
    }

    .row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-shrink: 0;
      position: relative;
      animation-duration: 25s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
      animation-direction: alternate;
    }

    .row:nth-child(odd) {
      animation-name: moveRowOdd;
    }

    .row:nth-child(even) {
      animation-name: moveRowEven;
    }

    @keyframes moveRowOdd {
      0% { transform: translateX(-30px); }
      100% { transform: translateX(30px); }
    }

    @keyframes moveRowEven {
      0% { transform: translateX(30px); }
      100% { transform: translateX(-30px); }
    }

    .stamp {
      height: auto;
      width: auto;
      max-height: 220px;
      max-width: 160px;
      transition: transform 0.3s ease;
      cursor: pointer;
      image-rendering: auto;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      object-fit: contain;
      margin: 0.5rem;
    }

    .stamp:hover {
      transform: scale(1.08);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      flex-direction: column;
    }

    .modal img {
      max-width: 90%;
      max-height: 80%;
      filter: none;
      background: none;
      box-shadow: none;
      border: none;
    }

    .caption {

      font-size: 1.4rem;
      text-align: center;
      background-color: #5c4942;
      padding: 1rem 1.5rem;
      border-radius: 6px;

      font-weight: 500;

    @media (max-width: 1200px) {

        max-width: 140px;
      }
      
      .section-title::after {

        max-width: 100px;

      .section-title::after {

    }

    const PUBLIC_STAMP_BASE = "https://raven-hd.github.io/raven-gifts/gryffindor/2025/";

    async function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
    }

    async function copyStampCode(imgData, button) {
      const imageUrl = PUBLIC_STAMP_BASE + imgData.src;
      const bbcode = `\n\n[hr]\n[right][width=70][img]${imageUrl}[/img][/width][/right]`;

      try {
        await copyTextToClipboard(bbcode);
        const icon = button.querySelector('i');
        button.classList.add('copied');
        icon.className = 'fas fa-check';

        setTimeout(() => {
          button.classList.remove('copied');
          icon.className = 'fas fa-copy';
        }, 1100);
      } catch (error) {
        console.error('Не удалось скопировать код марки:', error);
      }
    }

    function renderGallery(container, images) {
      container.innerHTML = '';
      let imageIndex = 0;

      for (let i = 0; i < rowPattern.length; i++) {
        const row = document.createElement('div');
        row.className = 'row';
        row.style.animationDelay = `${i * 0.5}s`;

        for (let j = 0; j < rowPattern[i]; j++) {
          if (imageIndex >= images.length) break;
          
          const imgData = images[imageIndex];

          const img = document.createElement('img');
          img.className = 'stamp';
          img.src = imgData.src;
          img.setAttribute('data-caption', imgData.caption);

          // Скрываем марки с плейсхолдерами
          if (imgData.src === "_") {
            img.style.display = "none";
          }

          const stampWrap = document.createElement('div');
          stampWrap.className = 'stamp-wrap';

          const copyButton = document.createElement('button');
          copyButton.type = 'button';
          copyButton.className = 'copy-stamp';
          copyButton.setAttribute('aria-label', 'Скопировать код марки');
          copyButton.setAttribute('title', 'Скопировать код марки');
          copyButton.innerHTML = '<i class="fas fa-copy" aria-hidden="true"></i>';

          copyButton.addEventListener('click', function (event) {
            event.stopPropagation();
            copyStampCode(imgData, copyButton);
          });

          stampWrap.appendChild(img);
          stampWrap.appendChild(copyButton);

          if (imgData.src === "_") {
            stampWrap.style.display = "none";
          }

          row.appendChild(stampWrap);
          imageIndex++;
        }
        container.appendChild(row);
      }
    }

    function renderAllSections() {

        titleElement.textContent = section.title;
        sectionContainer.appendChild(titleElement);
        
        // Создаем контейнер для галереи раздела

        galleryContainer.className = 'gallery';
        sectionContainer.appendChild(galleryContainer);
        
        // Рендерим галерею для этого раздела
        renderGallery(galleryContainer, section.images);
        
        sectionsContainer.appendChild(sectionContainer);

        modal.style.display = 'flex';
        modalImg.src = e.target.src;
        modalCaption.textContent = e.target.getAttribute('data-caption') || '';
      } else if (e.target === modal) {
        modal.style.display = 'none';
        modalImg.src = '';
        modalCaption.textContent = '';
      }
    });
  </script>
</body>
</html>
