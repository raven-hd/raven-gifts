// ─── SEEDED RANDOM: тот же принцип, что на странице марок ──────
function seededRand(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 0xffffffff;
  };
}

const field = document.getElementById('stamp-field');
const PUBLIC_STAMP_BASE = "https://raven-hd.github.io/raven-gifts/slytherin/2026/images/winners/";

async function copyTextToClipboard(text){
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return;}
  const textarea=document.createElement('textarea');
  textarea.value=text; textarea.setAttribute('readonly','');
  textarea.style.position='fixed'; textarea.style.opacity='0';
  document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); textarea.remove();
}
async function copyStampCode(stamp,button){
  const filename=stamp.src.split('/').pop();
  const imageUrl=PUBLIC_STAMP_BASE+filename;
  const bbcode=`\n\n[hr]\n[right][width=70][img]${imageUrl}[/img][/width][/right]`;
  try{
    await copyTextToClipboard(bbcode);
    const icon=button.querySelector('i'); button.classList.add('copied'); icon.className='fas fa-check';
    setTimeout(()=>{button.classList.remove('copied');icon.className='fas fa-copy';},1100);
  }catch(error){console.error('Не удалось скопировать код марки:',error);}
}

function createRows(stamps, groupIndex) {
  const rand = seededRand(23 + groupIndex * 101);
  const fw = document.body.clientWidth || window.innerWidth;

  let colPattern;
  if (fw < 500) colPattern = [3, 3, 4, 3];
  else if (fw < 750) colPattern = [5, 4, 5, 4];
  else colPattern = [6, 5, 6, 5, 6];

  const maxCols = Math.max(...colPattern);
  const GAP_X = fw < 500 ? 12 : (fw < 750 ? 20 : 28);
  const PAD = fw * 0.045;
  const SIZE_FACTOR = 0.58;
  let baseWidth = Math.round((fw - PAD * 2 - GAP_X * (maxCols - 1)) / maxCols * SIZE_FACTOR);
  if (baseWidth < 46) baseWidth = 46;

  const rows = [];
  let idx = 0, patIdx = 0;
  while (idx < stamps.length) {
    const cols = colPattern[patIdx % colPattern.length];
    const count = Math.min(cols, stamps.length - idx);
    rows.push({ cols, items: stamps.slice(idx, idx + count) });
    idx += count; patIdx++;
  }

  const fragment = document.createDocumentFragment();
  rows.forEach((row, rowIdx) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'stamp-row';
    rowEl.style.alignItems = rowIdx % 2 === 0 ? 'flex-end' : 'flex-start';

    const rawSizes = row.items.map(() => 0.80 + rand() * 0.38);
    rawSizes.sort((a, b) => b - a);
    const rowSizes = new Array(row.items.length);
    let lo = 0, hi = rawSizes.length - 1;
    for (let i = 0; i < rawSizes.length; i++) {
      rowSizes[i] = i % 2 === 0 ? rawSizes[lo++] : rawSizes[hi--];
    }

    row.items.forEach((stamp, colIdx) => {
      const sizeScale = rowSizes[colIdx];
      const stampWidth = Math.round(baseWidth * sizeScale);
      const sign = (rowIdx + colIdx) % 2 === 0 ? 1 : -1;
      const rot = sign * (1.2 + rand() * 7.5);

      const el = document.createElement('div');
      el.className = 'stamp-item';
      el.style.cssText = `width:${stampWidth}px; --rot:${rot.toFixed(1)}deg;`;

      const img = document.createElement('img');
      img.src = stamp.src; img.alt = stamp.name; img.draggable = false; img.loading = 'lazy';
      el.appendChild(img);

      const copyButton=document.createElement('button');
      copyButton.type='button'; copyButton.className='copy-stamp';
      copyButton.setAttribute('aria-label','Скопировать код марки');
      copyButton.setAttribute('title','Скопировать код марки');
      copyButton.innerHTML='<i class="fas fa-copy" aria-hidden="true"></i>';
      copyButton.addEventListener('click',event=>{event.stopPropagation();copyStampCode(stamp,copyButton);});
      el.appendChild(copyButton);

      el.addEventListener('click', () => openModal(stamp));
      rowEl.appendChild(el);
    });
    fragment.appendChild(rowEl);
  });
  return fragment;
}

function buildStampGrid() {
  field.innerHTML = '';
  winnerGroups.forEach((group, groupIndex) => {
    const groupEl = document.createElement('section');
    groupEl.className = 'winner-group';
    const title = document.createElement('h2');
    title.className = 'winner-group-title';
    title.textContent = group.title;
    groupEl.appendChild(title);
    groupEl.appendChild(createRows(group.stamps, groupIndex));
    field.appendChild(groupEl);
  });
}

window.addEventListener('load', buildStampGrid);
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(buildStampGrid, 220); });

// ─── MODAL: тот же, что на странице марок ─────────────────────
const modal  = document.getElementById('modal');
const mImg   = document.getElementById('modal-img');
const mName  = document.getElementById('modal-name');
const mRole  = document.getElementById('modal-role');
const mClose = document.getElementById('modal-close');
function openModal(stamp) {
  mImg.src = stamp.src; mName.textContent = stamp.name; mRole.textContent = stamp.role; modal.classList.add('open');
}
mClose.addEventListener('click', () => modal.classList.remove('open'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

// ─── ЭФФЕКТ КОЛЕБАНИЯ ВОДЫ: тот же, что на странице марок ────
document.addEventListener('click', e => {
  if (e.target.closest('#modal')) return;
  for (let i = 0; i < 4; i++) {
    const ring = document.createElement('div');
    ring.className = 'ripple-ring'; ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px';
    const spread = 1 + i * 0.28;
    const maxW = Math.round((100 + Math.random() * 40) * spread);
    const maxH = Math.round(maxW * (0.28 + Math.random() * 0.08));
    ring.style.setProperty('--maxW', maxW + 'px'); ring.style.setProperty('--maxH', maxH + 'px');
    ring.style.setProperty('--dur', (1.1 + i * 0.22 + Math.random() * 0.15).toFixed(2) + 's');
    ring.style.setProperty('--delay',(i * 0.11).toFixed(2) + 's');
    ring.style.borderColor = `rgba(172,156,108,${(0.6 - i * 0.12).toFixed(2)})`;
    document.body.appendChild(ring);
    ring.addEventListener('animationend', () => ring.remove(), { once: true });
  }
});
</script>
