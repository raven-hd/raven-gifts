    .stamp {

      cursor: pointer;
      image-rendering: auto;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
      object-fit: cover;
    }

    .stamp:hover {

      position: fixed;
      top: 0;
      left: 0;

    }

    const rowPattern = [6, 5, 6, 5, 6, 5, 6, 5, 6, 5, 6, 6];
    const mainGallery = document.getElementById('main-gallery');


    const PUBLIC_STAMP_BASE = "https://raven-hd.github.io/raven-gifts/hufflepuff/2025/";

    async function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
    }

    async function copyStampCode(imgData, button) {
      const imageUrl = PUBLIC_STAMP_BASE + imgData.src;
      const bbcode = `\n\n[hr]\n[right][width=70][img]${imageUrl}[/img][/width][/right]`;

      try {
        await copyTextToClipboard(bbcode);
        const icon = button.querySelector('i');
        button.classList.add('copied');
        icon.className = 'fas fa-check';

        setTimeout(() => {
          button.classList.remove('copied');
          icon.className = 'fas fa-copy';
        }, 1100);
      } catch (error) {
        console.error('Не удалось скопировать код марки:', error);
      }
    }

    function renderGallery() {
      mainGallery.innerHTML = '';
      let imageIndex = 0;

      for (let i = 0; i < rowPattern.length; i++) {
        const row = document.createElement('div');
        row.className = 'row';

        for (let j = 0; j < rowPattern[i]; j++) {
          const imgData = images[imageIndex % images.length];
          const angle = (Math.random() * 6 - 3).toFixed(2) + 'deg';
          const scale = (Math.random() * 0.4 + 0.8).toFixed(2);

          const img = document.createElement('img');
          img.className = 'stamp';
          img.src = imgData.src;
          img.setAttribute('style', `--angle: ${angle}; --scale: ${scale};`);
          img.setAttribute('data-caption', imgData.caption);

          const stampWrap = document.createElement('div');
          stampWrap.className = 'stamp-wrap';

          const copyButton = document.createElement('button');
          copyButton.type = 'button';
          copyButton.className = 'copy-stamp';
          copyButton.setAttribute('aria-label', 'Скопировать код марки');
          copyButton.setAttribute('title', 'Скопировать код марки');
          copyButton.innerHTML = '<i class="fas fa-copy" aria-hidden="true"></i>';

          copyButton.addEventListener('click', function (event) {
            event.stopPropagation();
            copyStampCode(imgData, copyButton);
          });

          stampWrap.appendChild(img);
          stampWrap.appendChild(copyButton);

          if (imgData.src === "_") {
            stampWrap.style.display = "none";
          }

          row.appendChild(stampWrap);
          imageIndex++;
        }
        mainGallery.appendChild(row);
      }
    }

    renderGallery();
    window.addEventListener('resize', renderGallery);

    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const modalCaption = document.getElementById('modal-caption');

    document.addEventListener('click', function (e) {
      if (e.target.classList.contains('stamp')) {
        modal.style.display = 'flex';
        modalImg.src = e.target.src;
        modalCaption.textContent = e.target.getAttribute('data-caption') || '';
      } else if (e.target === modal) {
        modal.style.display = 'none';
        modalImg.src = '';
        modalCaption.textContent = '';
      }
    });
